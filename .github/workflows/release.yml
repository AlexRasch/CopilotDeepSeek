name: Build & Release

on:
  push:
    branches:
      - master

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest  # Windows runner required for self-contained win-x64 builds

    permissions:
      contents: write  # Required to create releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js (for the Vue portal)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Install portal dependencies
        run: npm ci
        working-directory: portal

      - name: Publish (self-contained, single-file, trimmed)
        run: |
          dotnet publish CopilotDeepSeek/CopilotDeepSeek.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishAot=false `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=true `
            -p:TrimMode=partial `
            --output ./publish
        shell: pwsh

      - name: Create release zip
        run: Compress-Archive -Path ./publish/* -DestinationPath CopilotDeepSeek-win-x64.zip
        shell: pwsh

      - name: Generate version number (date + run number)
        id: version
        run: echo "tag=v$(Get-Date -Format 'yyyy.MM.dd').${{ github.run_number }}" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Automatic release from merge to master.
            Commit: ${{ github.sha }}
          files: CopilotDeepSeek-win-x64.zip
          draft: false
          prerelease: false